title: 关于我
description: 了解更多我在技术上的偏见、在产品上的偏执、在生活上的偏爱
content: |
  你好，我是 **Luz Liu** (刘惠)，一名当前司职前端的研发工程师。

  ## 前端与其他

  我坚信，研发岗位之间没有明显的界限，只是对个人的分工不同。基于人精力有限的前提，我们才需要持续保持在某一个方向的专业度。但是，这并不意味着我们不需要了解和掌握其他方向的知识。与我而言，后端 & UI & UX 我都不排斥去学习和了解。

  ## 产品设计

  对于一个产品来说，我最反感一味地堆砌功能，而忽略用户真实的使用场景和核心需求。相比而言，我更倾向于用最少的点击和最直白的逻辑来呈现最核心最常用的功能。

  ## 屏幕之外

  - 王者荣耀十年玩家，输了就下线，赢了就不睡
  - **A7M4** 拥有者，摄影学者
  - 乐道L60 主驾驶员（还在实习期）
